  - title: "Encoding justice with data: Environmental justice screening tools and the limits of quantification"
    authors: "Daouda, M., Gould, C.F."
    year: 2026
    venue: "Current Environmental Health Reports 13, 24"
    abstract: "Reviews how government environmental justice indices are structurally designed and used in research (2020-2025). They function as governance tools that shape resource allocation, but represent only a partial definition of justice, with procedural and community dimensions weakly captured."
    categories: [methods-measurement]
    links:
      - label: "Link"
        url: "https://doi.org/10.1007/s40572-026-00543-9"

  - title: "Health Insurance as Climate Adaptation: A Practical Framework"
    authors: "Gould, C.F., Tsou, A-C., Puliady, S., McMenamin, S.B."
    year: 2026
    venue: "Health Affairs 45(5), 471-479"
    abstract: "Proposes using public triggers like heat alerts and air quality indices to activate temporary insurance flexibilities, such as cooling access, indoor air filtration, and early prescription refills, during hazard windows. Argues this could be one of the most scalable near-term strategies for climate-health adaptation."
    categories: [climate-adaptation]
    links:
      - label: "Link"
        url: "https://www.healthaffairs.org/doi/full/10.1377/hlthaff.2025.01670"

  - title: "Acetylcholinesterase Activity from Childhood to Young Adulthood"
    authors: "Suarez-Torres, J.R.&dagger;, Gould, C.F.&dagger;, Vasishtha, D., Bradman, A., Suarez-Torres, J., Lopez-Paredes, D., Martinez, D., Moore, R."
    year: 2026
    venue: "Journal of Exposure Science and Environmental Epidemiology"
    abstract: "Establishes the first age- and sex-specific reference values for a key pesticide-exposure biomarker, acetylcholinesterase, from ages 4 to 26 in an agricultural community in Ecuador. Activity rises through adolescence before plateauing, and nearby flower-farm area is linked to lower levels, suggestive of pesticide drift effects."
    categories: [environmental-epidemiology]
    links:
      - label: "Link"
        url: "https://www.nature.com/articles/s41370-026-00866-7"

  - title: "Priorities and opportunities for clean energy transitions to advance health in low-income and middle-income countries"
    authors: "Gould, C.F.&dagger;, Gill-Wiehl, A.&dagger;, Pillarisetti, A., Kwong, L.H., Kammen, D., Clasen, T."
    year: 2026
    venue: "Lancet Global Health 14(4), E640-E652"
    abstract: "Outlines four priorities for clean energy transitions in low- and middle-income countries: rapidly displacing polluting fuels, aligning transitions with climate goals, and addressing persistent access inequalities. Argues clean energy must fully displace polluting fuels, not just reach households, to deliver health benefits."
    categories: [energy-transitions]
    links:
      - label: "Link"
        url: "https://www.thelancet.com/journals/langlo/article/PIIS2214-109X(25)00527-3/fulltext"

  - title: "Beyond access: Clean energy use in low- and middle-income countries"
    authors: "Gill-Wiehl, A.&dagger;, Gould, C.F.&dagger;, Jeuland, M., Pillarisetti, A., Pachauri, S., Shirley, R., Troncoso, K., Jack, D.W., Leach, M., Batchelor, S., Kwong, L.H., Kammen, D."
    year: 2026
    venue: "Lancet Global Health 14(4), E598-611"
    abstract: "Argues that simple access metrics, like whether a household has an electricity connection, overstate real progress by ignoring fuel stacking and dynamic consumption patterns. Targeted subsidies and reliable supply chains, not technical fixes alone, drive genuine clean energy transitions."
    categories: [energy-transitions]
    links:
      - label: "Link"
        url: "https://www.thelancet.com/journals/langlo/article/PIIS2214-109X(25)00532-7/fulltext"

  - title: "Household energy use and health in low- and middle-income countries"
    authors: "Pillarisetti, A., Daouda, M., Gould, C.F., Gill-Wiehl, A., Clasen, T., Kammen, D., Amegah, A.K., Balakrishnan, K."
    year: 2026
    venue: "Lancet Global Health 14(4), E612-E625"
    abstract: "Reviews the evidence on household air pollution's health burden, consistently in the millions of deaths annually despite methodological differences, and argues most research underestimates the full effect of home energy use by focusing narrowly on cooking."
    categories: [energy-transitions]
    links:
      - label: "Link"
        url: "https://www.thelancet.com/journals/langlo/article/PIIS2214-109X(26)00002-1/fulltext"

  - title: "Increasing risk of mass human heat mortality if historical weather patterns recur"
    authors: "Callahan, C., Trok, J., Wilson, A.J., Gould, C.F., Heft-Neal, S., Diffenbaugh, N.S., Burke, M."
    year: 2026
    venue: "Nature Climate Change 16, 26-32"
    abstract: "Projects that if the 2003 European heat wave recurred at today's temperatures, it would cause about 17,800 excess deaths across Europe in one week, rising to 32,000 at 3°C of warming — comparable to peak COVID-19 mortality and barely blunted by current adaptation."
    categories: [causal-inference]
    links:
      - label: "Link"
        url: "https://www.nature.com/articles/s41558-025-02480-1"

  - title: "Quantifying the contributions of climate change and adaptation to mortality from unprecedented extreme heat events"
    authors: "Callahan, C., Trok, J., Wilson, A.J., Gould, C.F., Heft-Neal, S., Burke, M., Diffenbaugh, N.S."
    year: 2025
    venue: "Proceedings of the National Academy of Sciences 122(51), e2503577122"
    abstract: "Revisiting the 2003 France heat wave, finds standard mortality models underpredict deaths by 55%. After correcting for compounding heat effects, attributes just over 6,000 deaths to climate change specifically, and shows adaptation since 2003 would cut a repeat event's toll by more than 75%."
    categories: [causal-inference, climate-adaptation]
    links:
      - label: "Link"
        url: "https://www.pnas.org/doi/10.1073/pnas.2503577122"

