    year: 2025
    venue: "Nature 647, 935-943"
    abstract: "Projects wildfire smoke could cause 71,420 excess US deaths per year by 2050 under high warming, a 73% increase over 2011-2020, with cumulative damages exceeding all other climate-driven harms in the US combined."
