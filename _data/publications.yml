    year: 2025
    venue: "Science Advances 11, 31"
    abstract: "Using California ED visits, hospitalizations, and deaths (2006-2017), shows mortality and morbidity respond to temperature differently. Future warming is projected to increase ED visits even as it decreases mortality, meaning declining death counts can mask rising healthcare burden."
    categories: [causal-inference]
    links:
      - label: "Link"
        url: "https://www.science.org/doi/10.1126/sciadv.adr3070"

