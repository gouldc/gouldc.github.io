---
layout: default
---

{% include base_path %}

<div id="main" role="main" class="home">
  <section class="br-home-hero">
    <div class="br-home-hero__title">
      <span class="br-label">Carlos F. Gould · Public Health · UCSD</span>
      <h1 class="br-page-title">Carlos<br>F. Gould.</h1>
    </div>
    <div class="br-home-hero__media">
      <img src="{{ "/images/gould_headshot.jpg" | relative_url }}" alt="{{ site.author.name }}">
    </div>
  </section>

  <section class="br-home-intro">
    {{ content }}
  </section>

  <section class="br-index" aria-label="Site index">
    <div class="br-index__header">
      <span class="br-label">§ Site sections</span>
    </div>
    {% for item in site.data.home.directory %}
      <a class="br-index__row" href="{{ item.url | relative_url }}">
        <span class="br-index__title">{{ item.title }}</span>
        <span class="br-index__desc">{{ item.description }}</span>
        <span class="br-index__arrow">↗</span>
      </a>
    {% endfor %}
  </section>
</div>
